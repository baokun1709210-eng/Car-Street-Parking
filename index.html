<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KUN STREET RACING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif}canvas{display:block}#loading{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 40%,#18212b,#05070b 65%);display:grid;place-items:center;text-align:center;padding:24px}#loading h1{color:#ff343d;letter-spacing:4px;font-size:clamp(25px,7vw,46px);margin:0 0 10px}#status{color:#c6ccd4;font-size:13px}#bar{width:min(340px,80vw);height:5px;background:#222;border-radius:9px;margin:18px auto;overflow:hidden}#fill{height:100%;width:0;background:#ff303a;transition:width .2s}#hud{position:fixed;inset:0;pointer-events:none;display:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#080b10c9;border:1px solid #ff343d88;border-radius:10px;padding:9px 12px;font-size:11px;letter-spacing:1px}.brand{color:#ff454d;font-weight:900;letter-spacing:2px}.speed{position:absolute;bottom:22px;left:18px;background:#080b10d9;border:1px solid #ff343d99;border-radius:14px;padding:10px 15px}.speed strong{font-size:38px}.speed small{color:#ff454d;display:block;letter-spacing:2px}.controls{position:absolute;bottom:20px;right:16px;display:flex;gap:10px;align-items:end;pointer-events:auto}.steer{display:flex;gap:8px;margin-right:8px}.ctrl{width:62px;height:62px;border-radius:16px;background:#111923cc;border:1px solid #ffffff55;color:#fff;font-size:25px;font-weight:bold;touch-action:none;user-select:none}.ctrl:active,.ctrl.on{background:#a51d27dd}.pedals{display:flex;gap:8px}.pedals .ctrl{width:68px;height:76px;font-size:12px}.gas{background:#a51d27aa}.hint{position:absolute;top:62px;left:12px;color:#d0d5dc;font-size:10px}.actions{position:absolute;top:62px;right:12px;display:flex;gap:7px;pointer-events:auto}.actions button{background:#101720dd;border:1px solid #ff343d88;color:white;border-radius:8px;padding:8px 10px;font-size:10px}@media(max-width:600px){.ctrl{width:55px;height:58px}.pedals .ctrl{width:60px;height:70px}.speed strong{font-size:32px}.hint{max-width:190px}}
</style></head><body>
<div id="loading"><div><h1>KUN STREET RACING</h1><div id="status">Đang khởi tạo đường phố...</div><div id="bar"><div id="fill"></div></div><div style="font-size:10px;color:#77818e;letter-spacing:2px">CITY MAP · SILVIA S14 URAS SLIME</div></div></div>
<div id="hud"><div class="top"><div class="pill"><div class="brand">KUN / STREET</div><div id="gear">GEAR N · 0 KM/H</div></div><div class="pill" id="mapstate">CITY FREE ROAM</div></div><div class="hint">WASD / phím mũi tên · Space: phanh · C: camera</div><div class="actions"><button id="cam">CAMERA</button><button id="reset">RESET</button></div><div class="speed"><strong id="speed">000</strong><small>KM/H</small></div><div class="controls"><div class="steer"><button class="ctrl" data-key="left">‹</button><button class="ctrl" data-key="right">›</button></div><div class="pedals"><button class="ctrl" data-key="brake">BRAKE</button><button class="ctrl gas" data-key="gas">GAS</button></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=s=>document.querySelector(s),status=$('#status'),fill=$('#fill');
let scene,camera,renderer,car,city,carRoot,wheels=[],speed=0,steer=0,yaw=0,camMode=0;
const keys={gas:false,brake:false,left:false,right:false};
function progress(t,p){status.textContent=t;fill.style.width=p+'%'}
scene=new THREE.Scene();scene.background=new THREE.Color(0x9baebd);scene.fog=new THREE.Fog(0x9baebd,220,1300);
camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,3500);
renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcecff,0x50505a,2));
const sun=new THREE.DirectionalLight(0xffe2c0,2.5);sun.position.set(180,260,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const fallback=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({color:0x41494c,roughness:1}));fallback.rotation.x=-Math.PI/2;fallback.position.y=-.2;fallback.receiveShadow=true;scene.add(fallback);
function makeFallbackCar(){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(2,.65,4.2),new THREE.MeshStandardMaterial({color:0xc51f35,metalness:.65,roughness:.28}));body.position.y=.72;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.65,1.8),new THREE.MeshStandardMaterial({color:0x17232e,metalness:.3,roughness:.2}));cabin.position.set(0,1.32,-.25);g.add(cabin);return g}
function showGame(){progress('Sẵn sàng! Đang vào thành phố...',100);setTimeout(()=>{$('#loading').style.display='none';$('#hud').style.display='block'},350)}
function loadCar(){progress('Đang tải Silvia S14 URAS Slime (GLB)...',72);new GLTFLoader().load('./assets/car/source/Silvia%20S14%20URAS%20Slime.glb',g=>{car=g.scene;setupCar(car)},undefined,e=>{console.error(e);progress('Không thấy model xe — dùng xe mẫu',80);setupCar(makeFallbackCar())})}
function setupCar(obj){car=obj;car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){if(o.material.map)o.material.map.colorSpace=THREE.SRGBColorSpace;o.material.needsUpdate=true}if(/wheel|tire|tyre|rim/i.test(o.name))wheels.push(o)}});const box=new THREE.Box3().setFromObject(car),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());car.position.sub(c);car.scale.setScalar(1.65/Math.max(size.y,.01));const scaled=new THREE.Box3().setFromObject(car);car.position.y-=scaled.min.y;carRoot=new THREE.Group();carRoot.add(car);carRoot.position.set(0,.03,0);scene.add(carRoot);showGame()}
progress('Đang tải bản đồ City 3D (FBX)...',4);
const manager=new THREE.LoadingManager();
manager.setURLModifier(url=>{
 const clean=decodeURIComponent(url.split(/[?#]/)[0]);
 if (/^(data:|blob:|https?:)/i.test(clean)) return url;
 const name=clean.split(/[\\/]/).pop();
 if (/\\.(png|jpe?g|webp|bmp|tga|tif|tiff)$/i.test(name)) {
  return './assets/city/textures/'+encodeURIComponent(name);
 }
 return url;
});
manager.onError=url=>console.warn('Missing city texture:',url);
new FBXLoader(manager).load('./assets/city/source/city-cpm.fbx',obj=>{city=obj;city.name='CITY_MAP';city.traverse(o=>{
 if(!o.isMesh)return;
 o.visible=true;
 o.frustumCulled=false;
 o.castShadow=true;
 o.receiveShadow=true;
 if(o.material){
  const ms=Array.isArray(o.material)?o.material:[o.material];
  ms.forEach(m=>{
   m.visible=true;
   m.side=THREE.DoubleSide;
   if(m.map){m.map.colorSpace=THREE.SRGBColorSpace;m.map.needsUpdate=true}
   m.needsUpdate=true;
  });
 }
});
const bounds=new THREE.Box3().setFromObject(city);
if(bounds.isEmpty()){throw new Error('FBX không có geometry hiển thị')}
const center=bounds.getCenter(new THREE.Vector3()),min=bounds.min.clone(),size=bounds.getSize(new THREE.Vector3());
city.position.set(-center.x,-min.y,-center.z);
scene.add(city);
city.updateMatrixWorld(true);
const finalBounds=new THREE.Box3().setFromObject(city);
const finalSize=finalBounds.getSize(new THREE.Vector3());
console.info('[CITY MAP DIAGNOSTIC]',{meshCount:city.children.length,before:size,after:finalSize,center});
scene.fog=null;
camera.far=Math.max(10000,finalSize.length()*3);
camera.updateProjectionMatrix();
fallback.visible=false;
$('#mapstate').textContent='CITY LOADED · '+finalSize.x.toFixed(0)+' × '+finalSize.z.toFixed(0);
progress('Đã nạp thành phố · Đang tải xe...',68);
loadCar()},xhr=>{if(xhr.total)progress('Đang tải thành phố '+Math.round(xhr.loaded/xhr.total*100)+'%',4+Math.round(xhr.loaded/xhr.total*62))},e=>{console.error(e);progress('Không tải được map FBX · dùng sân tập',50);loadCar()});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(carRoot){speed+=(keys.gas?24:keys.brake?-48:-10)*dt;speed=THREE.MathUtils.clamp(speed,-12,keys.gas?42:0);if(keys.brake&&speed<1)speed=0;const input=(keys.left?1:0)-(keys.right?1:0);steer=THREE.MathUtils.damp(steer,input,8,dt);yaw+=steer*dt*(.45+Math.abs(speed)*.025)*(speed>=0?1:-1);carRoot.rotation.y=yaw;carRoot.position.x+=Math.sin(yaw)*speed*dt*.42;carRoot.position.z+=Math.cos(yaw)*speed*dt*.42;wheels.forEach(w=>w.rotation.x+=speed*dt*.8);const back=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const target=camMode?carRoot.position.clone().add(new THREE.Vector3(0,1.65,0)).add(back.clone()):carRoot.position.clone().add(new THREE.Vector3(-back.x*9,4.1,-back.z*9));camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(carRoot.position.clone().add(new THREE.Vector3(0,1.1,0)).add(back.clone().multiplyScalar(camMode?12:4)));$('#speed').textContent=String(Math.round(Math.abs(speed)*3.6)).padStart(3,'0');$('#gear').textContent='GEAR '+(speed< -1?'R':speed>18?'3':speed>6?'2':'1')+' · '+Math.round(Math.abs(speed)*3.6)+' KM/H'}renderer.render(scene,camera)}
animate();
function bind(el,key){const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('on')},up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('on')};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up))}
document.querySelectorAll('[data-key]').forEach(b=>bind(b,b.dataset.key));
const keyMap={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'brake'};
addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='KeyC')toggleCam()});
addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=false});
function toggleCam(){camMode=(camMode+1)%2;$('#mapstate').textContent=camMode?'COCKPIT VIEW':'CITY FREE ROAM'}
$('#cam').onclick=toggleCam;$('#reset').onclick=()=>{if(carRoot){carRoot.position.set(0,.03,0);yaw=0;speed=0}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
